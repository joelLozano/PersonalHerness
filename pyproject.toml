[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentes"
version = "0.8.0"
description = "Harness de equipo de desarrollo profesional (multi-agente) para Claude Code y Kiro, con memoria vectorial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6,<7", "pillow>=10,<14"]

[project.optional-dependencies]
vector = ["chromadb>=0.5,<2", "fastembed>=0.4,<1"]
dev = ["pytest>=8"]

[project.scripts]
agentes = "agentes.cli:main"

[tool.setuptools]
packages = ["agentes"]

[tool.setuptools.package-data]
agentes = ["team.yaml", "requisitos.sh", "profiles/*.yaml"]
